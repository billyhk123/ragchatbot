apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ragchatbot
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containers:
        - image: gcr.io/PROJECT_ID/IMAGE:TAG
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "4Gi"
          env:
            - name: PORT
              value: "8080"
            - name: TELEGRAM_BOT_TOKEN
              value: "SET_IN_CLOUD_RUN"
            - name: SERVICE_URL
              value: "SET_IN_CLOUD_RUN"
            - name: POE_API_KEY
              value: "SET_IN_CLOUD_RUN"
            - name: POE_BOT_NAME
              value: "GPT-3.5-Turbo"
            - name: EMBEDDING_MODEL
              value: "sentence-transformers/all-MiniLM-L6-v2"
            - name: PERSIST_DIR
              value: "vectordb"
            - name: TEMPERATURE
              value: "0.2"
            - name: MAX_TOKENS
              value: "700"
            - name: FIREBASE_PROJECT_ID
              value: "SET_IN_CLOUD_RUN"
            - name: FIRESTORE_PREFIX
              value: ""
            - name: MEMORY_WINDOW_TURNS
              value: "6"
            - name: MEMORY_RECALL_K
              value: "4"
            - name: MEMORY_VECTOR_LIMIT
              value: "200"
            - name: PATHWAY_URL
              value: "http://localhost:8081"
            - name: PATHWAY_HOST
              value: "0.0.0.0"
            - name: PATHWAY_PORT
              value: "8081"
            - name: GCS_PROMPTS_BUCKET
              value: "ragchatbot-486618-prompts"
            - name: GCS_PROMPTS_FILE
              value: "prompts.yaml"
            - name: GCS_BUCKET
              value: "ragchatbot-raw"
            - name: GCS_PREFIX
              value: ""
            - name: GCS_SYNC_INTERVAL
              value: "60"
            - name: GCS_SYNC_DELETE
              value: "false"
            - name: LOCAL_DATA_DIR
              value: "/app/data/raw"
