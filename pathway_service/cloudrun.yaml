apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: pathway-retriever
spec:
  template:
    spec:
      containers:
        - image: gcr.io/PROJECT_ID/pathway-retriever:TAG
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: PATHWAY_HOST
              value: "0.0.0.0"
            - name: PATHWAY_PORT
              value: "8080"
            - name: GCS_BUCKET
              value: "ragchatbot-raw"
            - name: GCS_PREFIX
              value: ""
            - name: GCS_SYNC_INTERVAL
              value: "60"
            - name: GCS_SYNC_DELETE
              value: "false"
            - name: LOCAL_DATA_DIR
              value: "/app/data/raw"
            - name: EMBEDDING_MODEL
              value: "sentence-transformers/all-MiniLM-L6-v2"
