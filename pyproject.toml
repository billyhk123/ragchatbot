[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragchatbot"
version = "0.1.0"
description = "RAG chatbot with Telegram bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "requests",
  "python-dotenv",
  "pydantic",
  "langchain-core",
  "langchain-openai",
  "langchain-community",
  "faiss-cpu",
  "sentence-transformers",
  "firebase-admin",
  "numpy",
  "google-cloud-storage",
  "pyyaml",
  "python-telegram-bot",
  "pathway[xpack-llm,xpack-llm-docs]>=0.20",
  "openai",
  "unstructured",
  "pdf2image",
]

[tool.setuptools]
packages = ["app", "ingest", "server"]